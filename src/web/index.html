<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13171d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Persistence">
<meta name="referrer" content="no-referrer">
<title>Persistence</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script type="importmap">{"imports":{"marked":"/vendor/marked.esm.js"}}</script>
<script type="module" src="/main.ts"></script>
</head>
<body>

<section id="screen-boot" class="screen screen-center" aria-label="Loading">
  <div class="lamp" aria-hidden="true"></div>
</section>

<section id="screen-pair" class="screen screen-center" hidden aria-labelledby="pair-title">
  <form id="pair-form" class="card pair" autocomplete="off">
    <div class="lamp lamp-small" aria-hidden="true"></div>
    <h1 id="pair-title" class="screen-title">Pair this device</h1>
    <p class="screen-text">On the server, run <code>pi-durable serve pair</code> and enter the code it prints. A code works once, for 10 minutes.</p>
    <label class="field">
      <span class="field-label">Pairing code</span>
      <input id="pair-code" class="input input-code" name="code" required inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" pattern="[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}">
    </label>
    <label class="field">
      <span class="field-label">Device name</span>
      <input id="pair-name" class="input" name="name" required maxlength="40" spellcheck="false">
    </label>
    <p id="pair-error" class="form-error" role="alert"></p>
    <button id="pair-submit" class="btn btn-primary btn-wide" type="submit">Pair device</button>
  </form>
</section>

<section id="screen-gone" class="screen screen-center" hidden aria-labelledby="gone-title">
  <div class="card">
    <div class="lamp lamp-small lamp-out" aria-hidden="true"></div>
    <h1 id="gone-title" class="screen-title"></h1>
    <p id="gone-text" class="screen-text"></p>
    <a class="btn btn-wide" href="/">Reload</a>
  </div>
</section>

<main id="screen-chat" class="app" hidden>
  <div id="tools-bar" class="tools-bar" role="status" hidden>
    <strong class="tools-bar-label">TOOLS ON</strong>
    <span class="tools-bar-text">Pi can change files and run commands as you.</span>
    <button id="tools-off" class="tools-bar-button" type="button">Turn off</button>
  </div>
  <header class="top">
    <div class="top-row">
      <h1 class="brand">Pi</h1>
      <button id="model-chip" class="chip" type="button" aria-label="Change model">
        <span id="model-name" class="chip-text">…</span>
        <svg class="chip-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </button>
      <button id="menu-button" class="icon-button" type="button" aria-label="Menu" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
    <div id="status" class="status" aria-label="Status"></div>
    <div id="pulse" class="pulse" aria-hidden="true"></div>
  </header>
  <div id="banner" class="banner" role="status" hidden>
    <span id="banner-text"></span>
    <button id="banner-retry" class="banner-button" type="button">Retry now</button>
  </div>
  <div id="scroller" class="scroller">
    <ol id="feed" class="feed" aria-label="Conversation with Pi"></ol>
  </div>
  <div class="dock">
    <button id="jump" class="jump" type="button" hidden>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      Latest
    </button>
    <form id="composer" class="composer">
      <label class="sr-only" for="input">Message Pi</label>
      <textarea id="input" class="composer-input" rows="1" placeholder="Message Pi" autocomplete="off" enterkeyhint="enter"></textarea>
      <button id="stop" class="round-button round-stop" type="button" aria-label="Stop Pi" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
      <button id="send" class="round-button round-send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </form>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</main>

<dialog id="menu" class="menu" aria-label="Menu">
  <div class="menu-list">
    <button type="button" class="menu-item" data-action="agents">Agents</button>
    <button type="button" class="menu-item" data-action="memory">Memory</button>
    <button type="button" class="menu-item" data-action="model">Model</button>
    <button type="button" class="menu-item" data-action="tools">Coding tools</button>
    <button type="button" class="menu-item" data-action="settings">Settings</button>
    <button type="button" class="menu-item menu-danger" data-action="stop-all">Stop all</button>
  </div>
</dialog>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="sheet-heading">
        <nav id="sheet-crumbs" class="crumbs" aria-label="Back to" hidden></nav>
        <h2 id="sheet-title" class="sheet-title"></h2>
      </div>
      <button id="sheet-close" class="icon-button" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</dialog>

<dialog id="tools-confirm" class="confirm" aria-labelledby="tools-confirm-title" aria-describedby="tools-confirm-text">
  <form method="dialog">
    <h2 id="tools-confirm-title" class="confirm-title">Turn on coding tools?</h2>
    <p id="tools-confirm-text" class="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn" value="cancel" autofocus>Cancel</button>
      <button class="btn btn-danger" value="enable">Turn on tools</button>
    </div>
  </form>
</dialog>

</body>
</html>
