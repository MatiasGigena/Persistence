<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Persistence">
<meta name="referrer" content="no-referrer">
<title>Persistence</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">

<!-- Every module main.ts loads, fetched at once instead of one import level at a time (there is no bundler).
     After the import map, which must come first. test/web/shell.test.ts keeps the list complete. -->
<link rel="modulepreload" href="/link.ts">
<link rel="modulepreload" href="/store.ts">
<link rel="modulepreload" href="/chat-view.ts">
<link rel="modulepreload" href="/markdown.ts">
<link rel="modulepreload" href="/format.ts">
<link rel="modulepreload" href="/push.ts">
<link rel="modulepreload" href="/copy.ts">
<link rel="modulepreload" href="/attach.ts">
<link rel="modulepreload" href="/panels/sheet.ts">
<link rel="modulepreload" href="/panels/agents.ts">
<link rel="modulepreload" href="/panels/memory.ts">
<link rel="modulepreload" href="/panels/chat-settings.ts">
<link rel="modulepreload" href="/panels/tools.ts">
<link rel="modulepreload" href="/panels/cache.ts">
<link rel="modulepreload" href="/protocol/images.ts">
<link rel="modulepreload" href="/protocol/messages.ts">
<link rel="modulepreload" href="/protocol/machines.ts">
<link rel="modulepreload" href="/protocol/mirror.ts">
<link rel="modulepreload" href="/protocol/parse.ts">
<link rel="modulepreload" href="/protocol/util.ts">
<link rel="modulepreload" href="/protocol/version.ts">

<script type="module" src="/main.ts"></script>
</head>
<body>

<section id="screen-boot" class="screen screen-center" aria-label="Loading">
  <div class="lamp" aria-hidden="true"></div>
</section>

<section id="screen-pair" class="screen screen-center" hidden aria-labelledby="pair-title">
  <form id="pair-form" class="card pair" autocomplete="off">
    <div class="lamp lamp-small" aria-hidden="true"></div>
    <h1 id="pair-title" class="screen-title">Pair this device</h1>
    <p class="screen-text">On the server, run <code>pi-durable serve pair</code> and enter the code it prints. A code works once, for 5 minutes.</p>
    <label class="field">
      <span class="field-label">Pairing code</span>
      <input id="pair-code" class="input input-code" name="code" required inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="XXXX-XXXX" maxlength="9" pattern="[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}">
    </label>
    <label class="field">
      <span class="field-label">Device name</span>
      <input id="pair-name" class="input" name="name" required maxlength="40" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </label>
    <p id="pair-error" class="form-error" role="alert"></p>
    <button id="pair-submit" class="btn btn-primary btn-wide" type="submit">Pair device</button>
  </form>
</section>

<section id="screen-gone" class="screen screen-center" hidden aria-labelledby="gone-title">
  <div class="card">
    <div class="lamp lamp-small lamp-out" aria-hidden="true"></div>
    <h1 id="gone-title" class="screen-title"></h1>
    <p id="gone-text" class="screen-text"></p>
    <a class="btn btn-wide" href="/">Reload</a>
  </div>
</section>

<main id="screen-chat" class="app is-loading" hidden>
  <header class="top">
    <div class="top-row">
      <h1 class="brand">Pi</h1>
      <span id="model-name" class="top-model"></span>
      <span class="ghost ghost-model skeleton" aria-hidden="true"></span>
      <button id="settings-button" class="icon-button" type="button" aria-label="Chat settings" title="Chat settings" aria-haspopup="dialog" aria-controls="sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
      </button>
    </div>
    <div id="status" class="status" aria-label="Status"></div>
    <div class="ghost status" aria-hidden="true"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
    <div id="pulse" class="pulse" aria-hidden="true"></div>
  </header>
  <div id="banner" class="banner" role="status" hidden>
    <span id="banner-text"></span>
    <button id="banner-retry" class="banner-button" type="button">Retry now</button>
  </div>
  <div id="scroller" class="scroller">
    <ol id="feed" class="feed" aria-label="Conversation with Pi"></ol>
    <div class="ghost feed feed-ghost" aria-hidden="true">
      <div class="ghost-user skeleton"></div>
      <div class="ghost-reply"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
      <div class="ghost-user ghost-short skeleton"></div>
      <div class="ghost-reply ghost-brief"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
      <div class="ghost-user ghost-tall skeleton"></div>
      <div class="ghost-reply"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
    </div>
    <p class="sr-only ghost">Loading the conversation…</p>
  </div>
  <div class="dock">
    <button id="jump" class="jump" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      Latest
    </button>
    <ul id="attachments" class="attachments" aria-label="Images to send" hidden></ul>
    <form id="composer" class="composer">
      <input id="attach-file" class="sr-only" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
      <button id="attach" class="round-button round-attach" type="button" aria-label="Attach images" title="Attach images">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
      </button>
      <label class="sr-only" for="input">Message Pi</label>
      <textarea id="input" class="composer-input" rows="1" placeholder="Message Pi" autocomplete="off" enterkeyhint="enter"></textarea>
      <button id="send" class="round-button round-send" type="submit" aria-label="Send" data-mode="send">
        <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        <svg class="icon-steer" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="5" y="5" rx="2"/></svg>
      </button>
    </form>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</main>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="sheet-heading">
        <nav id="sheet-crumbs" class="crumbs" aria-label="Back to" hidden></nav>
        <h2 id="sheet-title" class="sheet-title" tabindex="-1"></h2>
      </div>
      <button id="sheet-close" class="icon-button" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</dialog>

<dialog id="viewer" class="viewer" aria-label="Image">
  <img id="viewer-image" class="viewer-image" alt="">
  <button id="viewer-close" class="icon-button viewer-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
</dialog>

<dialog id="tools-confirm" class="confirm" aria-labelledby="tools-confirm-title" aria-describedby="tools-confirm-text">
  <form method="dialog">
    <h2 id="tools-confirm-title" class="confirm-title">Turn on coding tools?</h2>
    <p id="tools-confirm-text" class="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn" value="cancel" autofocus>Cancel</button>
      <button class="btn btn-danger" value="enable">Turn on tools</button>
    </div>
  </form>
</dialog>

<dialog id="agents-confirm" class="confirm" aria-labelledby="agents-confirm-title" aria-describedby="agents-confirm-text">
  <form method="dialog">
    <h2 id="agents-confirm-title" class="confirm-title">Archive agents?</h2>
    <p id="agents-confirm-text" class="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn" value="cancel" autofocus>Cancel</button>
      <button class="btn btn-danger" value="archive">Archive</button>
    </div>
  </form>
</dialog>

</body>
</html>
